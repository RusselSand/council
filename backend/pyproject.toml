[project]
name = "spec-council"
version = "0.1.0"
description = "Локальный инструмент подготовки ТЗ: от брифа до согласованной спецификации"
requires-python = ">=3.14"
dependencies = [
    "agent-workers",
    "fastapi>=0.141",
    "uvicorn[standard]>=0.53",
]

[tool.uv.sources]
# Приватный репо: сборке Docker нужен AGENT_WORKERS_TOKEN, см. README.
agent-workers = { git = "https://github.com/RusselSand/agent-workers", tag = "v0.2.0" }

[dependency-groups]
dev = [
    "httpx>=0.28",
    "pytest>=9.1",
    "ruff>=0.16",
]

[build-system]
requires = ["hatchling>=1.32"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["spec_council"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
